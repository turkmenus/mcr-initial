<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Quote Statement Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      position: absolute; left: 120px; bottom: 100px;
      display: flex; flex-direction: column; opacity: 0; transform: translateY(40px);
    }
    .quote-box {
      background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(14px);
      border-left: 8px solid #EAB308; border-radius: 12px;
      padding: 20px 32px; min-width: 600px; max-width: 900px; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      position: relative;
    }
    .quotation-mark {
      position: absolute; right: 24px; top: 10px; font-size: 80px; line-height: 1;
      color: rgba(234, 179, 8, 0.15); font-family: Georgia, serif; font-weight: bold;
    }
    .speaker-name { color: #EAB308; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .statement-text { color: #FFFFFF; font-size: 24px; font-weight: 700; margin-top: 6px; line-height: 1.35; font-style: italic; }
    .source-label { color: #94A3B8; font-size: 13px; font-family: monospace; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="container">
    <div id="box" class="quote-box">
      <div class="quotation-mark">“</div>
      <div id="speaker" class="speaker-name">Devlet Yetkilisi</div>
      <div id="statement" class="statement-text">"Yatırımlarımız kararlılıkla devam edecek, yeni projeler yolda."</div>
      <div id="source" class="source-label">KAYNAK: Basın Toplantısı</div>
    </div>
  </div>

  <script>
    let currentData = { speaker: "Devlet Yetkilisi", statement: "Açıklama metni", source: "Basın Toplantısı", accent: "#EAB308" };

    function updateUI(data) {
      if (!data) return;
      currentData = { ...currentData, ...data };
      if (data.speaker) document.getElementById("speaker").innerText = data.speaker;
      if (data.statement) document.getElementById("statement").innerText = `"${data.statement.replace(/^"|"$/g, '')}"`;
      if (data.source) document.getElementById("source").innerText = `KAYNAK: ${data.source}`;
      if (data.accent) {
        document.getElementById("box").style.borderLeftColor = data.accent;
        document.getElementById("speaker").style.color = data.accent;
      }
    }

    function play() {
      gsap.killTweensOf("#container");
      gsap.fromTo("#container", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" });
    }

    function stop() {
      gsap.killTweensOf("#container");
      gsap.to("#container", { opacity: 0, y: 30, duration: 0.4, ease: "power2.in" });
    }

    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "PLAY") { if (msg.data) updateUI(msg.data); play(); }
      else if (msg.type === "STOP") { stop(); }
      else if (msg.type === "UPDATE") { updateUI(msg.data); }
    });

    window.play = play;
    window.stop = stop;
    window.update = updateUI;
  </script>
</body>
</html>
