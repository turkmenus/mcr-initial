<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Bumper Intro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #bumper {
      position: absolute; inset: 0; background: linear-gradient(135deg, #0A0F1D 0%, #1E1B4B 50%, #0A0F1D 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; transform: scale(1.05);
    }
    .title { color: #FFFFFF; font-size: 72px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .subtitle { color: #38BDF8; font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-top: 12px; }
    .host { color: #94A3B8; font-size: 18px; font-family: monospace; margin-top: 24px; }
  </style>
</head>
<body>
  <div id="bumper">
    <div id="title" class="title">GÜNDEM ÖZEL</div>
    <div id="subtitle" class="subtitle">BÖLGE EKONOMİSİ VE ENERJİ HATTI</div>
    <div id="host" class="host">SUNUCU: AHMET YILMAZ</div>
  </div>

  <script>
    function updateUI(data) {
      if (!data) return;
      if (data.programTitle) document.getElementById("title").innerText = data.programTitle;
      if (data.episodeSubtitle) document.getElementById("subtitle").innerText = data.episodeSubtitle;
      if (data.hostName) document.getElementById("host").innerText = data.hostName;
    }

    function play() {
      gsap.killTweensOf("#bumper");
      gsap.fromTo("#bumper", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" });
    }

    function stop() {
      gsap.killTweensOf("#bumper");
      gsap.to("#bumper", { opacity: 0, scale: 0.95, duration: 0.6, ease: "power2.in" });
    }

    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "PLAY") { if (msg.data) updateUI(msg.data); play(); }
      else if (msg.type === "STOP") { stop(); }
      else if (msg.type === "UPDATE") { updateUI(msg.data); }
    });

    window.play = play;
    window.stop = stop;
    window.update = updateUI;
  </script>
</body>
</html>
