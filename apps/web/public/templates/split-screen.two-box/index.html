<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Split Screen 2-Box Frame</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #wrapper {
      position: absolute; inset: 0; opacity: 0;
    }
    .topic-banner {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: #C8102E; color: #fff; font-weight: 900; font-size: 20px;
      padding: 10px 36px; border-radius: 8px; letter-spacing: 2px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .box-left-label {
      position: absolute; left: 160px; bottom: 120px;
      background: rgba(10, 15, 29, 0.95); border-left: 6px solid #38BDF8;
      color: #fff; font-weight: 800; font-size: 16px; padding: 8px 20px; border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .box-right-label {
      position: absolute; right: 160px; bottom: 120px;
      background: rgba(10, 15, 29, 0.95); border-left: 6px solid #10B981;
      color: #fff; font-weight: 800; font-size: 16px; padding: 8px 20px; border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="topic" class="topic-banner">HAZAR LİMANI CANLI YAYIN</div>
    <div id="leftLabel" class="box-left-label">STÜDYO • AŞKABAT</div>
    <div id="rightLabel" class="box-right-label">CANLI BAĞLANTI • TÜRKMENBAŞI</div>
  </div>

  <script>
    function updateUI(data) {
      if (!data) return;
      if (data.topic) document.getElementById("topic").innerText = data.topic;
      if (data.boxLeftLabel) document.getElementById("leftLabel").innerText = data.boxLeftLabel;
      if (data.boxRightLabel) document.getElementById("rightLabel").innerText = data.boxRightLabel;
    }

    function play() {
      gsap.killTweensOf("#wrapper");
      gsap.fromTo("#wrapper", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" });
    }

    function stop() {
      gsap.killTweensOf("#wrapper");
      gsap.to("#wrapper", { opacity: 0, duration: 0.4, ease: "power2.in" });
    }

    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "PLAY") { if (msg.data) updateUI(msg.data); play(); }
      else if (msg.type === "STOP") { stop(); }
      else if (msg.type === "UPDATE") { updateUI(msg.data); }
    });

    window.play = play;
    window.stop = stop;
    window.update = updateUI;
  </script>
</body>
</html>
