<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Social Media Lower Third</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      position: absolute; left: 120px; bottom: 100px;
      display: flex; flex-direction: column; opacity: 0; transform: translateY(40px);
    }
    .platform-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1DA1F2; color: #fff; font-weight: 900; font-size: 15px;
      padding: 6px 18px; border-radius: 8px 8px 0 0; width: fit-content; text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .content-card {
      background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(12px);
      border-left: 6px solid #1DA1F2; border-radius: 0 12px 12px 12px;
      padding: 16px 28px; min-width: 540px; max-width: 800px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .handle { color: #38BDF8; font-size: 17px; font-weight: 700; font-family: monospace; }
    .quote-text { color: #F8FAFC; font-size: 22px; font-weight: 600; margin-top: 4px; line-height: 1.3; }
  </style>
</head>
<body>
  <div id="container">
    <div id="platform" class="platform-badge">X (Twitter)</div>
    <div id="content" class="content-card">
      <div id="handle" class="handle">@haber_merkezi</div>
      <div id="quote" class="quote-text">Bölgedeki son gelişmeler canlı yayında değerlendiriliyor.</div>
    </div>
  </div>

  <script>
    let currentData = { platform: "X (Twitter)", handle: "@haber_merkezi", quote: "Canlı yayın açıklaması.", accent: "#1DA1F2" };

    function updateUI(data) {
      if (!data) return;
      currentData = { ...currentData, ...data };
      if (data.platform) document.getElementById("platform").innerText = data.platform;
      if (data.handle) document.getElementById("handle").innerText = data.handle;
      if (data.quote) document.getElementById("quote").innerText = data.quote;
      if (data.accent) {
        document.getElementById("platform").style.background = data.accent;
        document.getElementById("content").style.borderLeftColor = data.accent;
      }
    }

    function play() {
      gsap.killTweensOf("#container");
      gsap.fromTo("#container", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" });
    }

    function stop() {
      gsap.killTweensOf("#container");
      gsap.to("#container", { opacity: 0, y: 30, duration: 0.4, ease: "power2.in" });
    }

    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "PLAY") { if (msg.data) updateUI(msg.data); play(); }
      else if (msg.type === "STOP") { stop(); }
      else if (msg.type === "UPDATE") { updateUI(msg.data); }
    });

    window.play = play;
    window.stop = stop;
    window.update = updateUI;
  </script>
</body>
</html>
