<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Side Panel Bullet Points</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #panel {
      position: absolute; right: 80px; top: 180px; width: 480px;
      background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(16px);
      border-left: 6px solid #3B82F6; border-radius: 16px;
      padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      opacity: 0; transform: translateX(60px);
    }
    .header { color: #3B82F6; font-size: 18px; font-weight: 900; letter-spacing: 1px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
    .bullet-item {
      background: rgba(255,255,255,0.04); border-left: 3px solid #38BDF8;
      border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 12px;
      color: #F1F5F9; font-size: 16px; font-weight: 600; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div id="header" class="header">ZİRVEDE ÖNE ÇIKANLAR</div>
    <div id="p1" class="bullet-item">1. Enerji koridorunda yeni stratejik ortaklıklar</div>
    <div id="p2" class="bullet-item">2. Hazar geçişli ticaret hacminde %40 artış</div>
    <div id="p3" class="bullet-item">3. Ortak altyapı projeleri onaylandı</div>
  </div>

  <script>
    function updateUI(data) {
      if (!data) return;
      if (data.mainHeader) document.getElementById("header").innerText = data.mainHeader;
      if (data.point1) document.getElementById("p1").innerText = data.point1;
      if (data.point2) document.getElementById("p2").innerText = data.point2;
      if (data.point3) document.getElementById("p3").innerText = data.point3;
      if (data.accent) {
        document.getElementById("panel").style.borderLeftColor = data.accent;
        document.getElementById("header").style.color = data.accent;
      }
    }

    function play() {
      gsap.killTweensOf("#panel");
      gsap.fromTo("#panel", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" });
    }

    function stop() {
      gsap.killTweensOf("#panel");
      gsap.to("#panel", { opacity: 0, x: 60, duration: 0.4, ease: "power2.in" });
    }

    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "PLAY") { if (msg.data) updateUI(msg.data); play(); }
      else if (msg.type === "STOP") { stop(); }
      else if (msg.type === "UPDATE") { updateUI(msg.data); }
    });

    window.play = play;
    window.stop = stop;
    window.update = updateUI;
  </script>
</body>
</html>
