version: '3.8'

services:
  # ==========================================
  # 1. MCR Web Studio (Next.js 15 UI)
  # ==========================================
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    container_name: mcr-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - INTERNAL_REALTIME_URL=http://realtime:4001
      - INTERNAL_RENDERER_URL=http://renderer:4002
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      - realtime
      - renderer
    networks:
      - mcr-net

  # ==========================================
  # 2. MCR Realtime Hub & Switcher Gateway (WS/AMCP)
  # ==========================================
  realtime:
    build:
      context: ..
      dockerfile: Dockerfile
      target: realtime
    container_name: mcr-realtime
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-4001}:4001"
    expose:
      - "4001"
      - "5250"
    environment:
      - PORT=4001
      - NODE_ENV=production
      - CASPAR_HOST=${CASPAR_HOST:-127.0.0.1}
      - CASPAR_PORT=${CASPAR_PORT:-5250}
      - DATABASE_URL=postgres://mcr_user:mcr_secure_password@postgres:5432/mcr_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - mcr_data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - mcr-net

  # ==========================================
  # 3. MCR Render Worker & Media Asset Manager (FFmpeg + NVENC GPU Auto-Detect)
  # ==========================================
  renderer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: renderer
    container_name: mcr-renderer
    restart: unless-stopped
    expose:
      - "4002"
    environment:
      - PORT=4002
      - NODE_ENV=production
      - DATABASE_URL=postgres://mcr_user:mcr_secure_password@postgres:5432/mcr_db
      - REDIS_URL=redis://redis:6379
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,video,compute,utility
      - USE_GPU_ACCEL=auto
    volumes:
      - mcr_renders:/app/renders
      - mcr_uploads:/app/uploads
      - mcr_thumbs:/app/thumbnails
      - mcr_data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - mcr-net

  # ==========================================
  # 4. PostgreSQL Database (Internal Only)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: mcr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcr_user
      POSTGRES_PASSWORD: mcr_secure_password
      POSTGRES_DB: mcr_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcr-net

  # ==========================================
  # 5. Redis Queue Cache (Internal Only)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mcr-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - mcr-net

volumes:
  postgres_data:
  redis_data:
  mcr_data:
  mcr_renders:
  mcr_uploads:
  mcr_thumbs:

networks:
  mcr-net:
    driver: bridge
